# SPEC §16.9: the two required jobs, and perf on pushes to main. package arrives with step 12.
# Playwright (the e2e marker) runs on Windows only, as §16.9 lists it there.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ubuntu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked --python 3.14
      - name: ruff (lint)
        run: uv run ruff check src tests
      - name: ruff (format)
        run: uv run ruff format --check src tests
      - name: pyright
        run: uv run pyright
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: tsc --noEmit
        run: npm run typecheck
      - name: pytest (portable suite)
        run: uv run pytest -m "not e2e"

  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked --python 3.14
      - name: Install Chromium for Playwright
        run: uv run playwright install chromium
      - name: pytest (full suite, including windows-marked tests)
        run: uv run pytest

  perf:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked --python 3.14
      - name: search p95 within budget (SPEC §16.8)
        run: uv run pytest tests/perf --run-perf -s
