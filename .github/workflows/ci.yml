# SPEC §16.9: the two required jobs, and perf and package on pushes to main.
# Playwright (the e2e marker) runs on Windows only, as §16.9 lists it there.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ubuntu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked --python 3.14
      - name: ruff (lint)
        run: uv run ruff check src tests
      - name: ruff (format)
        run: uv run ruff format --check src tests
      - name: pyright
        run: uv run pyright
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: tsc --noEmit
        run: npm run typecheck
      - name: pytest (portable suite)
        run: uv run pytest -m "not e2e"

  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked --python 3.14
      - name: Install Chromium for Playwright
        run: uv run playwright install chromium
      - name: pytest (full suite, including windows-marked tests)
        run: uv run pytest

  perf:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked --python 3.14
      - name: search p95 within budget (SPEC §16.8)
        run: uv run pytest tests/perf --run-perf -s

  package:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - name: Build the wheel
        run: uv build --wheel --python 3.14 -o dist
      - name: VERSIONS files present, no outbound URLs (SPEC §13.6, §16.5)
        run: uv run --no-project --python 3.14 python -I scripts/check_wheel.py dist/memex-*.whl
      - name: Build a local wheelhouse of the runtime dependencies
        run: |
          uv export --locked --no-dev --no-emit-project --no-hashes --format requirements-txt > reqs.txt
          uvx --python 3.14 pip download -r reqs.txt -d wheelhouse --only-binary :all:
      - name: Install offline into a fresh venv
        run: |
          uv venv --python 3.14 fresh
          uv pip install --python fresh/Scripts/python.exe --no-index --find-links wheelhouse dist/memex-*.whl
      - name: Smoke test (GET /, one vendored file, quit)
        run: fresh/Scripts/python.exe -I scripts/smoke.py fresh/Scripts/memex.exe
