[project]
name = "memex"
version = "0.1.0"
description = "A personal, offline workspace for one manager, stored as plain Markdown files."
readme = "SPEC.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.135",
    "ruamel.yaml>=0.19.1,<0.20",
    "uvicorn>=0.30",
    "watchfiles>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.14",
    "pyright>=1.1.400",
    "httpx2>=2.16.0",
    "pytest-playwright>=0.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memex"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
# A dying test thread must fail the run, not hide behind a warning.
filterwarnings = ["error::pytest.PytestUnhandledThreadExceptionWarning"]
markers = [
    "windows: needs Windows; skipped elsewhere",
    "slow: real watcher or other slow tests",
    "e2e: Playwright journeys in a real browser",
    "perf: the search perf job (SPEC §16.8); runs only with --run-perf",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.14"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
